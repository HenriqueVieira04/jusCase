services:

  # meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: jusbr-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: qM83-WdQqSfdoM6-nOw2nyb8SvZs0v0SRNAl6728f-A
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # seeding
  seed:
    build:
      context: packages/backend/meilisearch
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY meilisearch.js cnj_assuntos.json ./
        ENV MEILI_HOST=http://meilisearch:7700
        ENV MEILI_KEY=qM83-WdQqSfdoM6-nOw2nyb8SvZs0v0SRNAl6728f-A
        CMD ["node", "meilisearch.js"]
    container_name: jusbr-seed
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: "no"

  # backend — express + apollo
  backend:
    build: packages/backend/express
    container_name: jusbr-backend
    ports:
      - "4001:4001"
    depends_on:
      meilisearch:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # frontend
  frontend:
    build: packages/frontend/jusBr
    container_name: jusbr-frontend
    ports:
      - "5178:5178"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  meili_data:
